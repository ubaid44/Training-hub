<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="home.html">TrainHub</a>
  </div>
</nav>

<!-- LOGIN CARD -->
<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card p-4 col-md-4 shadow">
    <h3 class="text-center mb-3">Login</h3>
    <div class="mb-3">
      <input type="text" id="username" class="form-control" placeholder="Username">
    </div>
    <div class="mb-3">
      <input type="password" id="password" class="form-control" placeholder="Password">
    </div>
    <button class="btn btn-primary w-100" onclick="login()">Login</button>
    <div id="errorMsg" class="mt-3 text-danger text-center"></div>
  </div>
</div>

<script>
function login() {
  const user = document.getElementById('username').value.trim();
  const pass = document.getElementById('password').value.trim();
  const errorMsg = document.getElementById('errorMsg');

  if(user === 'ali' && pass === '12345678') {
    errorMsg.style.color = 'green';
    errorMsg.innerText = 'Login Successful! Redirecting...';
    setTimeout(() => {
      window.location.href = 'home.html'; // redirect after success
    }, 1000);
  } else {
    errorMsg.style.color = 'red';
    errorMsg.innerText = 'Incorrect username or password!';
  }
}
</script>

</body>
</html>
